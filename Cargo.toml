[package]
name = "terminalcrypt-rust"
version = "3.2.0"
edition = "2021"

[lib]
name = "terminalcrypt_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module"] }
rayon = "1.10"
fin-primitives = { version = "4.0.1", default-features = false, features = ["indicators"] }
